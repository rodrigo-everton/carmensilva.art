<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;background:#f7f3ed;font-family:Arial,sans-serif;color:#241b1d">
    <main style="max-width:560px;margin:0 auto;padding:32px 20px">
      <section style="background:#ffffff;border-radius:12px;padding:28px">
        <p style="margin:0 0 20px;color:#7d2134;font-weight:700">Carmem Silva</p>
        <h1 style="margin:0 0 16px;font-size:24px">Redefina sua senha</h1>
        <p style="margin:0 0 24px;line-height:1.6">
          Recebemos uma solicitação para criar uma nova senha para {{ .Email }}.
        </p>
        <p style="margin:0 0 24px">
          <a href="{{ .ConfirmationURL }}" style="display:inline-block;border-radius:8px;background:#7d2134;color:#ffffff;padding:12px 18px;text-decoration:none;font-weight:700">Criar nova senha</a>
        </p>
        <p style="margin:0;color:#665b5d;font-size:14px;line-height:1.5">
          Se você não fez esta solicitação, ignore esta mensagem.
        </p>
      </section>
    </main>
  </body>
</html>
