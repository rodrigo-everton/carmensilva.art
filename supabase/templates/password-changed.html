<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;background:#f7f3ed;font-family:Arial,sans-serif;color:#241b1d">
    <main style="max-width:560px;margin:0 auto;padding:32px 20px">
      <section style="background:#ffffff;border-radius:12px;padding:28px">
        <p style="margin:0 0 20px;color:#7d2134;font-weight:700">Carmem Silva</p>
        <h1 style="margin:0 0 16px;font-size:24px">Sua senha foi alterada</h1>
        <p style="margin:0 0 16px;line-height:1.6">
          A senha da conta {{ .Email }} foi alterada recentemente.
        </p>
        <p style="margin:0;line-height:1.6">
          Se não foi você, <a href="{{ .SiteURL }}/recuperar-senha" style="color:#7d2134;font-weight:700">redefina sua senha imediatamente</a>.
        </p>
      </section>
    </main>
  </body>
</html>
